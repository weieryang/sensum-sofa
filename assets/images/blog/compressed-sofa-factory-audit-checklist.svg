    <text x="45" y="48" fill="#17352f" font-family="Arial, sans-serif" font-size="22" font-weight="700">AUDIT OUTPUT</text>
    <text x="45" y="92" fill="#554f46" font-family="Arial, sans-serif" font-size="22">Photo evidence</text>
    <text x="270" y="92" fill="#d6a84f" font-family="Arial, sans-serif" font-size="28">+</text>
    <text x="320" y="92" fill="#554f46" font-family="Arial, sans-serif" font-size="22">Document references</text>
    <text x="585" y="92" fill="#d6a84f" font-family="Arial, sans-serif" font-size="28">+</text>
    <text x="635" y="92" fill="#554f46" font-family="Arial, sans-serif" font-size="22">Risk owner and due date</text>
    <text x="930" y="92" fill="#d6a84f" font-family="Arial, sans-serif" font-size="28">=</text>
