      <text x="90" y="88" text-anchor="middle" fill="#17352f" font-size="38" font-weight="700">01</text>
      <text x="90" y="173" text-anchor="middle" fill="#17352f" font-size="23" font-weight="700">IDENTITY</text>
      <text x="90" y="207" text-anchor="middle" fill="#554f46" font-size="18">Legal entity</text>
      <text x="90" y="234" text-anchor="middle" fill="#554f46" font-size="18">Site and scope</text>
    </g>
    <g transform="translate(360 330)">
