      <text x="90" y="88" text-anchor="middle" fill="#17352f" font-size="38" font-weight="700">05</text>
      <text x="90" y="173" text-anchor="middle" fill="#17352f" font-size="23" font-weight="700">PACKING</text>
      <text x="90" y="207" text-anchor="middle" fill="#554f46" font-size="18">Compression record</text>
      <text x="90" y="234" text-anchor="middle" fill="#554f46" font-size="18">Carton controls</text>
    </g>
