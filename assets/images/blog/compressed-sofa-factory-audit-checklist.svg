      <text x="90" y="173" text-anchor="middle" fill="#17352f" font-size="23" font-weight="700">CAPACITY</text>
      <text x="90" y="207" text-anchor="middle" fill="#554f46" font-size="18">People and flow</text>
      <text x="90" y="234" text-anchor="middle" fill="#554f46" font-size="18">Order evidence</text>
    </g>
    <g transform="translate(610 330)">
