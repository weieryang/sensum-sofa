      <text x="90" y="173" text-anchor="middle" fill="#17352f" font-size="23" font-weight="700">MATERIALS</text>
      <text x="90" y="207" text-anchor="middle" fill="#554f46" font-size="18">Foam and fabric</text>
      <text x="90" y="234" text-anchor="middle" fill="#554f46" font-size="18">Lot traceability</text>
    </g>
    <g transform="translate(860 330)">
