<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Compressed sofa factory audit checklist</title>
  <desc id="desc">Six audit gates covering identity, capacity, materials, production control, compression packing and export readiness.</desc>
  <rect width="1600" height="900" fill="#f2eee5"/>
  <path d="M0 0h1600v225L0 430Z" fill="#17352f"/>
  <text x="110" y="110" fill="#d6a84f" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">BUYER AUDIT WORKFLOW</text>
