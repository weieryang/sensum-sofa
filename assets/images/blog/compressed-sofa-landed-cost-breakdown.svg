<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Compressed Sofa Landed Cost Breakdown for Importers</title>
  <desc id="desc">An infographic showing factory price, packaging, ocean freight, duty, local delivery and returns risk in compressed sofa landed cost planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e8"/>
      <stop offset="100%" stop-color="#ece5d7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbf8f2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="48" y="40" width="1104" height="820" rx="32" fill="url(#panel)" stroke="#d9cdb8"/>
  <text x="80" y="104" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7c6d57">Weieryang Buyer Guide</text>
  <text x="80" y="152" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#1f1a14">Compressed Sofa Landed Cost Breakdown</text>
  <text x="80" y="192" font-family="Arial, sans-serif" font-size="22" fill="#5d5245">Use the full cost stack before comparing FOB quotes.</text>
  <rect x="80" y="236" width="460" height="262" rx="24" fill="#1f1a14"/>
  <text x="112" y="284" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">1. Cost Stack</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="112" y="316" width="184" height="38" rx="19" fill="#c58a2a"/>
    <text x="128" y="342" fill="#ffffff">Factory FOB</text>
    <rect x="112" y="366" width="218" height="38" rx="19" fill="#d2a14f"/>
    <text x="128" y="392" fill="#ffffff">Packing / Carton</text>
    <rect x="112" y="416" width="246" height="38" rx="19" fill="#dfba78"/>
    <text x="128" y="442" fill="#1f1a14">Ocean Freight</text>
    <rect x="112" y="466" width="168" height="38" rx="19" fill="#e7cf9b"/>
    <text x="128" y="492" fill="#1f1a14">Duty / Tax</text>
  </g>
  <text x="112" y="544" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Landed cost = unit cost + freight + import charges + local handling</text>
  <rect x="572" y="236" width="548" height="262" rx="24" fill="#fff7ea" stroke="#d9cdb8"/>
  <text x="604" y="284" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#1f1a14">2. Numbers Buyers Must Request</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#3f352c">
    <circle cx="620" cy="334" r="7" fill="#03a84e"/>
    <text x="640" y="341">Carton size and package count</text>
    <circle cx="620" cy="378" r="7" fill="#03a84e"/>
    <text x="640" y="385">CBM per unit and 40HQ loading reference</text>
    <circle cx="620" cy="422" r="7" fill="#03a84e"/>
    <text x="640" y="429">Gross weight and local delivery limits</text>
    <circle cx="620" cy="466" r="7" fill="#03a84e"/>
    <text x="640" y="473">OEM label, barcode and carton artwork scope</text>
  </g>
  <rect x="80" y="534" width="500" height="270" rx="24" fill="#fff7ea" stroke="#d9cdb8"/>
  <text x="112" y="582" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#1f1a14">3. Where Quotes Go Wrong</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#3f352c">
    <circle cx="128" cy="632" r="7" fill="#c0392b"/>
    <text x="148" y="639">Comparing FOB only, without CBM</text>
    <circle cx="128" cy="676" r="7" fill="#c0392b"/>
    <text x="148" y="683">Ignoring carton changes from OEM packaging</text>
    <circle cx="128" cy="720" r="7" fill="#c0392b"/>
    <text x="148" y="727">Missing reserve for damage / return handling</text>
  </g>
  <rect x="614" y="534" width="506" height="270" rx="24" fill="#1b6e43"/>
  <text x="646" y="582" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">4. Practical Buyer Actions</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#ffffff">
    <text x="646" y="634">Build one landed-cost sheet per model</text>
    <text x="646" y="678">Recalculate after sample or carton revision</text>
    <text x="646" y="722">Compare warehouse and last-mile constraints</text>
  </g>
  <text x="80" y="842" font-family="Arial, sans-serif" font-size="18" fill="#6b6259">Recommended companion pages: Packing Guide, 40HQ Guide, MOQ and Lead Time Guide, RFQ Checklist</text>
</svg>
