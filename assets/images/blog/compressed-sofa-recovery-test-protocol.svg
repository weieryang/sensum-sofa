<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Compressed sofa compression and recovery test protocol</title>
  <desc id="desc">A buyer test timeline covering the reference sample, compressed storage record, unpacking, timed observations and final approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1ede4"/><stop offset="1" stop-color="#dce4d5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#263024" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="80" r="270" fill="#c8d2bd" opacity=".48"/>
  <circle cx="80" cy="850" r="310" fill="#e4c7bb" opacity=".45"/>
  <text x="88" y="105" fill="#ad4a35" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">MODEL-SPECIFIC BUYER TEST</text>
  <text x="88" y="172" fill="#20251f" font-family="Georgia, serif" font-size="55">Compression &amp; Recovery Protocol</text>
  <text x="88" y="216" fill="#60665d" font-family="Arial, sans-serif" font-size="23">Record conditions, time points, measurements and approval evidence</text>
  <g filter="url(#shadow)"><rect x="88" y="282" width="1424" height="436" rx="34" fill="#fffdf8"/></g>
  <path d="M190 508H1406" fill="none" stroke="#6f7a68" stroke-width="5"/>
  <g fill="#ad4a35"><circle cx="190" cy="508" r="15"/><circle cx="485" cy="508" r="15"/><circle cx="790" cy="508" r="15"/><circle cx="1095" cy="508" r="15"/><circle cx="1406" cy="508" r="15"/></g>
  <g font-family="Arial, sans-serif">
    <g transform="translate(130 330)">
      <rect width="120" height="105" rx="18" fill="#e8eee3"/>
      <path d="M22 72V45c0-12 10-22 22-22h32c12 0 22 10 22 22v27M14 70h92v20H14z" fill="none" stroke="#263024" stroke-width="5"/>
    </g>
    <g transform="translate(425 330)">
      <rect width="120" height="105" rx="18" fill="#eee7db"/>
      <path d="M20 30h80v58H20zM30 20h60v10" fill="none" stroke="#263024" stroke-width="5"/>
      <path d="M44 47h32M44 62h32" stroke="#ad4a35" stroke-width="4"/>
    </g>
    <g transform="translate(730 330)">
      <rect width="120" height="105" rx="18" fill="#e8eee3"/>
      <path d="M23 25l74 58M97 25L23 83" stroke="#263024" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(1035 330)">
      <rect width="120" height="105" rx="18" fill="#eee7db"/>
      <circle cx="60" cy="54" r="31" fill="none" stroke="#263024" stroke-width="5"/>
      <path d="M60 32v25l17 10" fill="none" stroke="#ad4a35" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(1346 330)">
      <rect width="120" height="105" rx="18" fill="#263024"/>
      <path d="M30 55l19 19 43-47" fill="none" stroke="#f5f1e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g fill="#263024" font-size="21" font-weight="700" text-anchor="middle">
      <text x="190" y="566">REFERENCE</text><text x="485" y="566">PACK &amp; STORE</text><text x="790" y="566">UNPACK</text><text x="1095" y="566">TIMED CHECKS</text><text x="1406" y="566">FINAL REVIEW</text>
    </g>
    <g fill="#697066" font-size="17" text-anchor="middle">
      <text x="190" y="605">Baseline dimensions</text><text x="190" y="630">and approved photos</text>
      <text x="485" y="605">Method, carton, dates</text><text x="485" y="630">and storage conditions</text>
      <text x="790" y="605">Start time, safe opening</text><text x="790" y="630">and complete video</text>
      <text x="1095" y="605">Same angles, measures</text><text x="1095" y="630">and condition notes</text>
      <text x="1406" y="605">Compare with agreed</text><text x="1406" y="630">acceptance criteria</text>
    </g>
  </g>
  <rect x="88" y="770" width="1424" height="66" rx="18" fill="#263024"/>
  <text x="800" y="812" fill="#f4f0e7" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">NO UNIVERSAL PASS TIME: APPROVE THE MODEL, METHOD, CONDITIONS AND FINAL CHECKPOINT IN WRITING</text>
